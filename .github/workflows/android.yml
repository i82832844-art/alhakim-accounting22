name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android project
        run: flutter create --platforms=android --org com.alhakim --project-name alhakim_accounting .

      - name: Configure Android build tools and JVM
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle")
          s = settings.read_text()
          s = re.sub(
              r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])[^"\']+(["\'])',
              r'\g<1>8.9.1\2',
              s,
          )
          s = re.sub(
              r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[^"\']+(["\'])',
              r'\g<1>2.1.0\2',
              s,
          )
          settings.write_text(s)

          app = Path("android/app/build.gradle")
          s = app.read_text()

          block = """    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = '17'\n    }\n"""

          s = re.sub(r'\n\s*compileOptions\s*\{.*?\n\s*\}', '', s, flags=re.S)
          s = re.sub(r'\n\s*kotlinOptions\s*\{.*?\n\s*\}', '', s, flags=re.S)
          s = s.replace('android {', 'android {\n' + block, 1)

          app.write_text(s)
          PY

          echo '--- settings.gradle ---'
          grep -E 'com.android.application|org.jetbrains.kotlin.android' android/settings.gradle
          echo '--- app/build.gradle JVM config ---'
          grep -A8 -n 'compileOptions' android/app/build.gradle

      - name: Add camera permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = '    <uses-permission android:name="android.permission.CAMERA" />\n'

          if "android.permission.CAMERA" not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n' + permission
              )

          s = s.replace(
              'android:label="alhakim_accounting"',
              'android:label="الحكيم للمحاسبة"'
          )

          p.write_text(s)
          PY

      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alhakim-accounting-apk
          path: build/app/outputs/flutter-apk/app-release.apk
