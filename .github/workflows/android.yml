name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android project
        run: flutter create --platforms=android --org com.alhakim --project-name alhakim_accounting .

      - name: Add camera permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = '    <uses-permission android:name="android.permission.CAMERA" />\n'

          if "android.permission.CAMERA" not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n' + permission
              )

          s = s.replace(
              'android:label="alhakim_accounting"',
              'android:label="الحكيم للمحاسبة"'
          )

          p.write_text(s)
          PY

      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alhakim-accounting-apk
          path: build/app/outputs/flutter-apk/app-release.apk
